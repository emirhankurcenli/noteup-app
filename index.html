<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Samsung Galaxy S23 FE için geliştirilmiş, hatırlatıcılı, borç takip eklentili ve ortak paylaşımlı premium mobil not defteri uygulaması." />
    <meta name="theme-color" content="#000000" />
    <title>NoteUp - Premium Not Defteri</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app_theme') || localStorage.getItem('s23_theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
